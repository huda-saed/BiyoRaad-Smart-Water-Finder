<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard | BiyoRaad</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page="admin" data-layout="admin">
<div id="nav"></div>
<div class="app"><aside id="side"></aside><main class="main"><div class="page-head d-flex flex-wrap justify-content-between align-items-center gap-2"><div><h2><span data-i18n="adm_title">Admin dashboard</span></h2><p><span data-i18n="adm_sub">Overview of sources, users and reports.</span></p></div></div><div class="row g-3 mb-3"><div class="col-6 col-xl-3"><div class="br-card kpi"><div class="icon-box"><i class="bi bi-droplet-fill"></i></div><div><b id="aSources">0</b><span><span data-i18n="a_sources">Water sources</span></span></div></div></div><div class="col-6 col-xl-3"><div class="br-card kpi"><div class="icon-box"><i class="bi bi-people"></i></div><div><b id="aUsers">0</b><span><span data-i18n="a_users">Registered users</span></span></div></div></div><div class="col-6 col-xl-3"><div class="br-card kpi"><div class="icon-box"><i class="bi bi-hourglass-split"></i></div><div><b id="aPending">0</b><span><span data-i18n="a_pending">Pending reports</span></span></div></div></div><div class="col-6 col-xl-3"><div class="br-card kpi"><div class="icon-box"><i class="bi bi-check2-circle"></i></div><div><b id="aResolved">0</b><span><span data-i18n="a_resolved">Resolved reports</span></span></div></div></div></div>
<div class="row g-3 mb-3"><div class="col-lg-8"><div class="br-card p-3"><h6><span data-i18n="a_month">Reports per month</span></h6><div class="chart-box"><canvas id="chMonth"></canvas></div></div></div><div class="col-lg-4"><div class="br-card p-3"><h6><span data-i18n="a_types">Sources by type</span></h6><div class="chart-box"><canvas id="chTypes"></canvas></div></div></div></div>
<div class="row g-3"><div class="col-lg-7"><div class="br-card p-3"><div class="d-flex justify-content-between"><h6><span data-i18n="a_recent">Latest reports</span></h6><a class="small" href="manage-reports.html"><span data-i18n="view_all">View all sources</span></a></div><div class="table-responsive"><table class="table"><thead><tr><th><span data-i18n="col_user">Reported by</span></th><th><span data-i18n="col_source">Source</span></th><th><span data-i18n="col_problem">Problem</span></th><th><span data-i18n="col_status">Status</span></th></tr></thead><tbody id="aRecent"></tbody></table></div></div></div>
<div class="col-lg-5"><div class="br-card p-3"><h6><span data-i18n="a_attn">Sources needing attention</span></h6><div id="aAttn"></div></div></div></div></main></div>
<div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/pages.js"></script>
</body>
</html>
