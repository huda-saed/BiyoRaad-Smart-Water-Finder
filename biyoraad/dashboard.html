<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard | BiyoRaad</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page="dashboard" data-layout="user">
<div id="nav"></div>
<div class="app"><aside id="side"></aside><main class="main"><div class="page-head d-flex flex-wrap justify-content-between align-items-center gap-2"><div><h2><span data-i18n="welcome">Welcome back, Amina</span></h2><p><span data-i18n="dash_sub">Here is the water situation around you.</span></p></div><a href="report.html" class="btn btn-teal"><i class="bi bi-plus-lg"></i> <span data-i18n="new_report">New report</span></a></div>
<div class="row g-3 mb-3"><div class="col-6 col-xl-3"><div class="br-card kpi"><div class="icon-box"><i class="bi bi-droplet-fill"></i></div><div><b id="kSources">0</b><span><span data-i18n="k_avail">Sources with water</span></span></div></div></div><div class="col-6 col-xl-3"><div class="br-card kpi"><div class="icon-box"><i class="bi bi-card-checklist"></i></div><div><b id="kReports">0</b><span><span data-i18n="k_myrep">My reports</span></span></div></div></div><div class="col-6 col-xl-3"><div class="br-card kpi"><div class="icon-box"><i class="bi bi-check2-circle"></i></div><div><b id="kResolved">0</b><span><span data-i18n="k_resolved">Resolved</span></span></div></div></div><div class="col-6 col-xl-3"><div class="br-card kpi"><div class="icon-box"><i class="bi bi-exclamation-triangle"></i></div><div><b id="kAlerts">0</b><span><span data-i18n="k_alerts">Sources needing attention</span></span></div></div></div></div>
<div class="row g-3 mb-3"><div class="col-lg-8"><div class="br-card p-3"><h6><span data-i18n="trend">Water level, last 6 months</span></h6><div class="chart-box"><canvas id="chTrend"></canvas></div></div></div>
<div class="col-lg-4"><div class="br-card p-3"><h6><span data-i18n="status_split">Sources by status</span></h6><div class="chart-box"><canvas id="chStatus"></canvas></div></div></div></div>
<div class="row g-3"><div class="col-lg-7"><div class="br-card p-3"><div class="d-flex justify-content-between"><h6><span data-i18n="recent_rep">My recent reports</span></h6><a href="my-reports.html" class="small"><span data-i18n="view_all">View all sources</span></a></div><div class="table-responsive"><table class="table"><thead><tr><th><span data-i18n="col_date">Date</span></th><th><span data-i18n="col_source">Source</span></th><th><span data-i18n="col_problem">Problem</span></th><th><span data-i18n="col_sev">Severity</span></th><th><span data-i18n="col_status">Status</span></th></tr></thead><tbody id="recent"></tbody></table></div></div></div>
<div class="col-lg-5"><div class="br-card p-3"><h6><span data-i18n="alerts">Low or dry sources</span></h6><div id="alerts"></div></div></div></div></main></div>
<div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/pages.js"></script>
</body>
</html>
