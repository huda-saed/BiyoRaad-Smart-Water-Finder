<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Reports | BiyoRaad</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page="myreports" data-layout="user">
<div id="nav"></div>
<div class="app"><aside id="side"></aside><main class="main"><div class="page-head d-flex flex-wrap justify-content-between align-items-center gap-2"><div><h2><span data-i18n="mr_title">My reports</span></h2><p><span data-i18n="mr_sub">Track every shortage you have reported.</span></p></div><a href="report.html" class="btn btn-teal"><i class="bi bi-plus-lg"></i> <span data-i18n="new_report">New report</span></a></div>
<div class="br-card p-3"><div class="mb-3 col-md-4 p-0"><select id="mrFilter" class="form-select"><option value="">All statuses</option><option value="pending">Pending</option><option value="investigating">Investigating</option><option value="resolved">Resolved</option></select></div>
<div class="table-responsive"><table class="table"><thead><tr><th>#</th><th><span data-i18n="col_date">Date</span></th><th><span data-i18n="col_source">Source</span></th><th><span data-i18n="col_problem">Problem</span></th><th><span data-i18n="col_sev">Severity</span></th><th><span data-i18n="col_status">Status</span></th><th></th></tr></thead><tbody id="mrBody"></tbody></table></div></div>
<div class="modal fade" id="viewModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5 class="modal-title"><span data-i18n="view_req">Report details</span></h5><button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div><div class="modal-body" id="vBody"></div></div></div></div></main></div>
<div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/pages.js"></script>
</body>
</html>
