<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report Shortage | BiyoRaad</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page="report" data-layout="user">
<div id="nav"></div>
<div class="app"><aside id="side"></aside><main class="main"><div class="page-head d-flex flex-wrap justify-content-between align-items-center gap-2"><div><h2><span data-i18n="rep_title">Report a water shortage</span></h2><p><span data-i18n="rep_sub">Tell us what is wrong. A local team will review it.</span></p></div></div>
<div class="br-card p-4"><form id="reportForm" data-demo="1" novalidate><div class="row g-4"><div class="col-lg-6">
<div class="mb-3"><label class="form-label" for="rSource"><span data-i18n="rep_source">Water source</span></label><select id="rSource" class="form-select" required></select></div>
<div class="row"><div class="col-md-6 mb-3"><label class="form-label" for="rType"><span data-i18n="rep_type">Problem</span></label><select id="rType" class="form-select"><option value="No water">No water</option><option value="Broken pump">Broken pump</option><option value="Contaminated">Contaminated</option><option value="Low pressure">Low pressure</option><option value="Long queue">Long queue</option></select></div>
<div class="col-md-6 mb-3"><label class="form-label" for="rSev"><span data-i18n="rep_sev">How serious is it?</span></label><select id="rSev" class="form-select"><option value="High">High</option><option value="Medium" selected>Medium</option><option value="Low">Low</option></select></div></div>
<div class="mb-3"><label class="form-label" for="rDesc"><span data-i18n="rep_desc">What happened?</span></label><textarea id="rDesc" rows="4" class="form-control" required minlength="10"></textarea></div>
<div class="mb-3"><label class="form-label" for="rPhoto"><span data-i18n="rep_photo">Photo (optional)</span></label><input id="rPhoto" type="file" accept="image/*" class="form-control"><img id="rPrev" class="d-none mt-2 rounded" style="max-height:120px" alt=""></div></div>
<div class="col-lg-6"><label class="form-label"><span data-i18n="rep_loc">Click the map or drag the pin to mark the exact spot</span></label><div id="pickMap" class="pick-map"></div><div class="row g-2 mt-1"><div class="col"><input id="rLat" class="form-control form-control-sm" readonly></div><div class="col"><input id="rLng" class="form-control form-control-sm" readonly></div></div></div></div>
<div class="text-end mt-3"><a href="dashboard.html" class="btn btn-light me-2"><span data-i18n="cancel">Cancel</span></a><button class="btn btn-teal px-4"><span data-i18n="rep_send">Send report</span></button></div></form></div></main></div>
<div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/pages.js"></script>
</body>
</html>
