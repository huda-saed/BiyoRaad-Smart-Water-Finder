<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage Sources | BiyoRaad</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page="managesources" data-layout="admin">
<div id="nav"></div>
<div class="app"><aside id="side"></aside><main class="main"><div class="page-head d-flex flex-wrap justify-content-between align-items-center gap-2"><div><h2><span data-i18n="ms_title">Manage water sources</span></h2><p><span data-i18n="ms_sub">Add, edit or remove sources shown to the public.</span></p></div><div class="d-flex gap-2"><button class="btn btn-light" id="msReset"><i class="bi bi-arrow-counterclockwise"></i> <span data-i18n="reset_data">Restore sample data</span></button><button class="btn btn-teal" id="msAdd"><i class="bi bi-plus-lg"></i> <span data-i18n="add_source">Add water source</span></button></div></div>
<div class="br-card p-3"><input id="msSearch" class="form-control mb-3 col-md-4" style="max-width:360px" placeholder="Search" data-i18n-ph="search_s"><div class="table-responsive"><table class="table"><thead><tr><th><span data-i18n="name">Name</span></th><th><span data-i18n="col_loc">Location</span></th><th><span data-i18n="col_status">Status</span></th><th><span data-i18n="col_cap">Level</span></th><th><span data-i18n="col_qual">Quality</span></th><th></th></tr></thead><tbody id="msBody"></tbody></table></div></div>
<div class="modal fade" id="srcModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-centered"><form class="modal-content" id="srcForm" data-demo="1" novalidate><div class="modal-header"><h5 class="modal-title" id="srcTitle"></h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
<div class="modal-body"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="s_name"><span data-i18n="name">Name</span></label><input id="s_name" type="text" class="form-control" required ></div><div class="col-md-6"><label class="form-label" for="s_city"><span data-i18n="city">City</span></label><input id="s_city" type="text" class="form-control" required ></div><div class="col-md-6"><label class="form-label" for="s_region"><span data-i18n="region">Region</span></label><input id="s_region" type="text" class="form-control" list="regionList" required ><datalist id="regionList"><option value="Maroodi Jeex"><option value="Sahil"><option value="Togdheer"><option value="Awdal"><option value="Sanaag"><option value="Sool"></datalist></div><div class="col-md-6"><label class="form-label" for="s_type"><span data-i18n="type">Type</span></label><select id="s_type" class="form-select"><option>Borehole</option><option>Well</option><option>Water Kiosk</option><option>Berkad</option><option>River</option><option>Spring</option></select></div>
<div class="col-md-6"><label class="form-label" for="s_status"><span data-i18n="col_status">Status</span></label><select id="s_status" class="form-select"><option value="available">Available</option><option value="low">Low</option><option value="dry">Dry</option></select></div><div class="col-md-6"><label class="form-label" for="s_capacity"><span data-i18n="cap">Water level %</span></label><input id="s_capacity" type="number" class="form-control" required min=0 max=100></div><div class="col-md-6"><label class="form-label" for="s_quality"><span data-i18n="qual">Quality %</span></label><input id="s_quality" type="number" class="form-control" required min=0 max=100></div><div class="col-md-6"><label class="form-label" for="s_lat"><span data-i18n="lat">Latitude</span></label><input id="s_lat" type="number" class="form-control" required step=any></div><div class="col-md-6"><label class="form-label" for="s_lng"><span data-i18n="lng">Longitude</span></label><input id="s_lng" type="number" class="form-control" required step=any></div></div></div>
<div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal"><span data-i18n="cancel">Cancel</span></button><button class="btn btn-teal"><span data-i18n="save">Save changes</span></button></div></form></div></div></main></div>
<div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/pages.js"></script>
</body>
</html>
