<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Water Map | BiyoRaad</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page="map" data-layout="public">
<div id="nav"></div>
<div class="container-xl py-3"><div class="d-flex flex-wrap gap-2 align-items-center mb-3"><h4 class="m-0 me-auto fw-bold"><span data-i18n="map_title">Interactive water map</span></h4>
<button class="chip active" data-f="all"><span data-i18n="all">All</span></button><button class="chip" data-f="available"><span data-i18n="s_available">Available</span></button><button class="chip" data-f="low"><span data-i18n="s_low">Low</span></button><button class="chip" data-f="dry"><span data-i18n="s_dry">Dry</span></button><button class="btn btn-teal btn-sm" id="locate"><i class="bi bi-crosshair"></i> <span data-i18n="locate">My location</span></button></div>
<div class="map-layout"><div class="br-card map-side" id="mapList"></div><div id="map"></div></div>
<p class="small text-muted mt-2 mb-0"><i class="bi bi-info-circle"></i> <span data-i18n="map_note">Base map, place names and borders are supplied by OpenStreetMap and may differ from local naming. Water source pins are BiyoRaad sample data.</span></p></div>
<div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/pages.js"></script>
</body>
</html>
