<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register | BiyoRaad</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page="register" data-layout="public">
<div id="nav"></div>
<div class="auth-wrap"><div class="br-card auth-card"><h3 class="fw-bold"><span data-i18n="reg_title">Create your account</span></h3><p class="text-muted"><span data-i18n="reg_sub">Join BiyoRaad to report shortages and follow your reports.</span></p>
<form id="regForm" data-demo="1" novalidate>
<div class="mb-3"><label class="form-label" for="rName"><span data-i18n="full_name">Full name</span></label><input id="rName" class="form-control" required></div>
<div class="row"><div class="col-md-6 mb-3"><label class="form-label" for="rEmail"><span data-i18n="email">Email</span></label><input id="rEmail" type="email" class="form-control" required></div>
<div class="col-md-6 mb-3"><label class="form-label" for="rPhone"><span data-i18n="phone">Phone number</span></label><input id="rPhone" class="form-control" placeholder="+252 63 ..." required></div></div>
<div class="mb-3"><label class="form-label" for="rRegion"><span data-i18n="region">Region</span></label><select id="rRegion" class="form-select" required><option>Maroodi Jeex</option><option>Sahil</option><option>Togdheer</option><option>Awdal</option><option>Sanaag</option><option>Sool</option></select></div>
<div class="row"><div class="col-md-6 mb-3"><label class="form-label" for="rPass"><span data-i18n="password">Password</span></label><input id="rPass" type="password" minlength="6" class="form-control" required></div>
<div class="col-md-6 mb-3"><label class="form-label" for="rPass2"><span data-i18n="confirm_pw">Confirm password</span></label><input id="rPass2" type="password" class="form-control" required><div class="invalid-feedback"><span data-i18n="pw_mismatch">Passwords do not match.</span></div></div></div>
<div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="rTerms" required><label class="form-check-label" for="rTerms"><span data-i18n="agree">I agree to the terms of use</span></label></div>
<button class="btn btn-teal w-100 py-2"><span data-i18n="nav_register">Register</span></button></form>
<p class="text-center mt-3 mb-0"><span data-i18n="have_acc">Already have an account?</span> <a href="login.html"><span data-i18n="nav_login">Login</span></a></p></div></div>
<div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/pages.js"></script>
</body>
</html>
