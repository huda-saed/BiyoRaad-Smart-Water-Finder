<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | BiyoRaad</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page="login" data-layout="public">
<div id="nav"></div>
<div class="auth-wrap"><div class="br-card auth-card"><h3 class="fw-bold"><span data-i18n="login_title">Welcome back</span></h3><p class="text-muted"><span data-i18n="login_sub">Log in to see your dashboard and reports.</span></p>
<form id="loginForm" data-demo="1" novalidate>
<div class="mb-3"><label class="form-label" for="lEmail"><span data-i18n="email">Email</span></label><input id="lEmail" type="email" class="form-control" required></div>
<div class="mb-3"><label class="form-label" for="lPass"><span data-i18n="password">Password</span></label><div class="input-group"><input id="lPass" type="password" class="form-control" required><button type="button" class="btn btn-outline-secondary" id="togglePw" aria-label="Show password"><i class="bi bi-eye"></i></button></div></div>
<div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="lRem"><label class="form-check-label" for="lRem"><span data-i18n="remember">Remember me</span></label></div>
<button class="btn btn-teal w-100 py-2"><span data-i18n="nav_login">Login</span></button></form>
<hr><p class="small text-muted mb-2"><span data-i18n="demo">Demo access (no password needed)</span></p><div class="d-grid gap-2"><button class="btn btn-outline-teal" id="demoUser"><span data-i18n="demo_user">Open as community member</span></button><button class="btn btn-outline-secondary" id="demoAdmin"><span data-i18n="demo_admin">Open as administrator</span></button></div>
<p class="text-center mt-3 mb-0"><span data-i18n="no_acc">New here?</span> <a href="register.html"><span data-i18n="nav_register">Register</span></a></p></div></div>
<div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/pages.js"></script>
</body>
</html>
