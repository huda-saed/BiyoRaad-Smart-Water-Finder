<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Us | BiyoRaad</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page="contact" data-layout="public">
<div id="nav"></div>
<section class="page-banner"><div class="container-xl"><h1><span data-i18n="con_title">Contact us</span></h1><p><span data-i18n="con_sub">Questions, partnerships or feedback? We read every message.</span></p></div></section>
<section class="section"><div class="container-xl"><div class="row g-4"><div class="col-lg-6"><div class="br-card p-4"><form id="contactForm" data-demo="1" novalidate>
<div class="row"><div class="col-md-6 mb-3"><label class="form-label" for="cName"><span data-i18n="full_name">Full name</span></label><input id="cName" class="form-control" required></div><div class="col-md-6 mb-3"><label class="form-label" for="cEmail"><span data-i18n="email">Email</span></label><input id="cEmail" type="email" class="form-control" required></div></div>
<div class="mb-3"><label class="form-label" for="cSub"><span data-i18n="subject">Subject</span></label><input id="cSub" class="form-control" required></div>
<div class="mb-3"><label class="form-label" for="cMsg"><span data-i18n="message">Message</span></label><textarea id="cMsg" rows="5" class="form-control" required></textarea></div><button class="btn btn-teal px-4"><span data-i18n="send">Send message</span></button></form></div></div>
<div class="col-lg-6"><div class="br-card p-4 mb-3"><h5><span data-i18n="office">Our office</span></h5><p class="mb-1"><i class="bi bi-geo-alt text-info"></i> <span data-i18n="office_addr">Koodbuur District, Hargeisa, Somaliland</span></p><p class="mb-1"><i class="bi bi-envelope text-info"></i> info@biyoraad.org</p><p class="mb-1"><i class="bi bi-telephone text-info"></i> +252 63 000 0000</p><p class="mb-0"><i class="bi bi-clock text-info"></i> <span data-i18n="hours">Sat - Thu, 8 AM - 5 PM</span></p></div><div class="br-card p-2"><div id="offMap" class="mini-map"></div></div></div></div></div></section>
<div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/pages.js"></script>
</body>
</html>
