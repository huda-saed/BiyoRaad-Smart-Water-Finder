<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Profile | BiyoRaad</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page="profile" data-layout="user">
<div id="nav"></div>
<div class="app"><aside id="side"></aside><main class="main"><div class="page-head d-flex flex-wrap justify-content-between align-items-center gap-2"><div><h2><span data-i18n="prof_title">My profile</span></h2><p><span data-i18n="prof_sub">Update your personal details and password.</span></p></div></div>
<div class="row g-4"><div class="col-lg-4"><div class="br-card p-4 text-center"><span class="avatar mx-auto mb-3" style="width:90px;height:90px;font-size:1.8rem" id="pAvatar"></span><h5 id="pName" class="mb-0"></h5><p class="text-muted" id="pEmail"></p><hr><b class="fs-3" id="pReports">0</b><div class="text-muted"><span data-i18n="k_myrep">My reports</span></div></div></div>
<div class="col-lg-8"><div class="br-card p-4 mb-4"><form id="profileForm" data-demo="1" novalidate><div class="row">
<div class="col-md-6 mb-3"><label class="form-label" for="p_name"><span data-i18n="full_name">Full name</span></label><input id="p_name" class="form-control" required></div>
<div class="col-md-6 mb-3"><label class="form-label" for="p_email"><span data-i18n="email">Email</span></label><input id="p_email" type="email" class="form-control" required></div>
<div class="col-md-6 mb-3"><label class="form-label" for="p_phone"><span data-i18n="phone">Phone number</span></label><input id="p_phone" class="form-control"></div>
<div class="col-md-6 mb-3"><label class="form-label" for="p_region"><span data-i18n="region">Region</span></label><select id="p_region" class="form-select"><option>Maroodi Jeex</option><option>Sahil</option><option>Togdheer</option><option>Awdal</option><option>Sanaag</option><option>Sool</option></select></div></div><button class="btn btn-teal"><span data-i18n="save">Save changes</span></button></form></div>
<div class="br-card p-4"><h6><span data-i18n="change_pw">Change password</span></h6><form id="pwForm" data-demo="1" novalidate><div class="row"><div class="col-md-6 mb-3"><label class="form-label" for="pw1"><span data-i18n="cur_pw">Current password</span></label><input id="pw1" type="password" class="form-control" required></div><div class="col-md-6 mb-3"><label class="form-label" for="pw2"><span data-i18n="new_pw">New password</span></label><input id="pw2" type="password" minlength="6" class="form-control" required></div></div><button class="btn btn-outline-teal"><span data-i18n="change_pw">Change password</span></button></form></div></div></div></main></div>
<div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/pages.js"></script>
</body>
</html>
